name: Validate Luqyak worker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax with concise failure logs
        run: |
          npm run check > /tmp/luqyak-check.log 2>&1 || { tail -c 2500 /tmp/luqyak-check.log; exit 1; }
          npm test
