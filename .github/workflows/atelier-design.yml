name: Verify Luqyak Atelier design
on:
  pull_request:
    paths:
      - 'worker.js'
      - 'luqyak-atelier-theme.css'
      - 'luqyak-theme-response.js'
      - 'tests/atelier-design.test.mjs'
      - 'tests/atelier-pwa-colors.test.mjs'
      - 'tests/essential-components.test.mjs'
      - '.github/workflows/atelier-design.yml'
  workflow_dispatch:
jobs:
  design-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check worker source
        run: node --check worker.js 2>/tmp/syntax.log || { tail -c 700 /tmp/syntax.log; exit 1; }
      - name: Verify premium layout and navigation
        run: node --test tests/atelier-design.test.mjs tests/atelier-pwa-colors.test.mjs tests/essential-components.test.mjs tests/essential-components.test.mjs
